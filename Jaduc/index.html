<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADUC | Autenticação</title>
    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-card">
        <!-- ==========================================
             PAINEL AZUL (BRANDING / ILUSTRAÇÕES)
        ========================================== -->
        <aside class="brand-panel">
            
            <!-- 1. CONTEÚDO DO LOGIN (MARTELO) -->
            <div class="brand-content brand-login">
                <div class="brand-header">
                    <h1 class="welcome-title">Bem Vindo!</h1>
                    <div class="brand-logo-group">
                        <span class="logo-subtext">Ao Site</span>
                        <span class="logo-name">JADUC</span>
                    </div>
                </div>

                <!-- Ilustração do Martelo -->
                <div class="brand-illustration" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 386 313" fill="none" class="martelo">
                        <rect x="74.0182" y="22.8174" width="23" height="97" rx="11.5"
                            transform="rotate(-63.5265 74.0182 22.8174)" fill="#F8EDE5" />
                        <rect x="0.000578763" y="160.23" width="26" height="102" rx="13"
                            transform="rotate(-63.5265 0.000578763 160.23)" fill="#F8EDE5" />
                        <rect x="164.966" y="125.084" width="167" height="31" rx="10"
                            transform="rotate(26.4735 164.966 125.084)" fill="#F8EDE5" />
                        <rect x="325.614" y="186.096" width="38" height="66" rx="15"
                            transform="rotate(26.4735 325.614 186.096)" fill="#F8EDE5" />
                        <rect x="151.054" y="94.6958" width="22" height="70" rx="10"
                            transform="rotate(26.4735 151.054 94.6958)" fill="#F8EDE5" />
                        <rect x="17.8492" y="135.605" width="122" height="97" rx="20"
                            transform="rotate(-63.5265 17.8492 135.605)" fill="#F8EDE5" />
                    </svg>

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 54" fill="none" class="base-mallet">
                        <rect x="20" y="25" width="25" height="110" rx="12.5" transform="rotate(-90 20 25)"
                            fill="#F8EDE5" />
                        <rect y="54" width="25" height="150" rx="12.5" transform="rotate(-90 0 54)" fill="#F8EDE5" />
                    </svg>
                </div>
            </div>

            <!-- 2. CONTEÚDO DO CADASTRO (BALANÇA DA JUSTIÇA) -->
            <div class="brand-content brand-register">
                <div class="brand-header">
                    <h1 class="welcome-title register-title">Vamos começar</h1>
                    <div class="brand-logo-group register-logo-group">
                        <span class="logo-subtext">o seu</span>
                        <span class="logo-name">Cadastro</span>
                    </div>
                </div>

                <!-- Ilustração Vetorial da Balança -->
                <div class="brand-illustration scale-illustration" aria-hidden="true">
                    <svg viewBox="0 0 280 230" fill="none" xmlns="http://www.w3.org/2000/svg" class="scale-svg">
                        <!-- Coluna e Base Central -->
                        <path d="M138 28L140 18L142 28C142 34 138 34 138 28Z" fill="#F8EDE5" />
                        <rect x="138" y="32" width="4" height="155" rx="2" fill="#F8EDE5" />
                        <path d="M128 187H152V192C152 195.3 149.3 198 146 198H134C130.7 198 128 195.3 128 192V187Z" fill="#F8EDE5" />
                        <rect x="120" y="198" width="40" height="12" rx="6" fill="#F8EDE5" />

                        <!-- Haste Superior Curvada -->
                        <g class="scale-beam-group">
                            <path d="M42 68C85 52 195 52 238 68" stroke="#F8EDE5" stroke-width="4" stroke-linecap="round" />
                            <circle cx="140" cy="56" r="6" fill="#F8EDE5" />

                            <!-- Prato Esquerdo -->
                            <g class="scale-pan-left">
                                <path d="M42 68L22 135M42 68L62 135" stroke="#F8EDE5" stroke-width="2" stroke-linecap="round" />
                                <path d="M20 135C20 135 42 145 64 135L62 135H22L20 135Z" fill="#F8EDE5" />
                                <path d="M22 135C22 143 42 145 62 145C82 145 62 143 62 135" stroke="#F8EDE5" stroke-width="3" />
                            </g>

                            <!-- Prato Direito -->
                            <g class="scale-pan-right">
                                <path d="M238 68L218 135M238 68L258 135" stroke="#F8EDE5" stroke-width="2" stroke-linecap="round" />
                                <path d="M216 135C216 135 238 145 260 135L258 135H218L216 135Z" fill="#F8EDE5" />
                                <path d="M218 135C218 143 238 145 258 145C278 145 258 143 258 135" stroke="#F8EDE5" stroke-width="3" />
                            </g>
                        </g>
                    </svg>
                </div>
            </div>

        </aside>

        <!-- ==========================================
             PAINEL BRANCO (FORMULÁRIOS)
        ========================================== -->
        <section class="form-panel">
            
            <!-- 1. FORMULÁRIO DE LOGIN -->
            <div class="form-content form-login">
                <h2 class="form-title">Faça login com sua conta</h2>

                <form class="login-form" autocomplete="on">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" class="input-field" placeholder="Digite seu email" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="login-password">Senha</label>
                        <input type="password" id="login-password" name="password" class="input-field" placeholder="Digite sua senha" required autocomplete="current-password">
                    </div>

                    <div class="remember-row">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="remember-me" name="remember-me">
                            <span class="checkmark"></span>
                            <span class="label-text">Lembre de mim</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-primary">
                        <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
                        </svg>
                        <span class="text">Entrar na comunidade</span>
                        <span class="circle"></span>
                        <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
                        </svg>
                    </button>

                    <div class="forgot-row">
                        <a href="#recuperar-senha" class="link-forgot">Esqueceu sua senha?</a>
                    </div>

                    <div class="social-section">
                        <p class="social-title">Ou faça login com</p>
                        <div class="social-buttons">
                            <button type="button" class="btn-social" aria-label="Entrar com Microsoft">
                                <img src="img/microsoft_icon.svg" alt="Microsoft" class="social-icon">
                            </button>
                            <button type="button" class="btn-social" aria-label="Entrar com Google">
                                <img src="img/google_icon.svg" alt="Google" class="social-icon">
                            </button>
                        </div>
                    </div>

                    <hr class="divider">

                    <p class="register-text">
                        Não está cadastrado? <a href="javascript:void(0)" id="to-register-btn" class="link-register">Clique aqui</a>
                    </p>
                </form>
            </div>

            <!-- 2. FORMULÁRIO DE CADASTRO -->
            <div class="form-content form-register">
                <h2 class="form-title">Crie sua conta</h2>

                <form class="login-form" autocomplete="on">
                    <div class="form-group">
                        <label for="reg-name">Digite seu Nome</label>
                        <input type="text" id="reg-name" name="name" class="input-field" placeholder="JADUC COMUNIART" required autocomplete="given-name">
                    </div>

                    <div class="form-group">
                        <label for="reg-lastname">Digite seu Sobrenome</label>
                        <input type="text" id="reg-lastname" name="lastname" class="input-field" placeholder="Digite seu sobrenome" required autocomplete="family-name">
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Digite seu Email</label>
                        <input type="email" id="reg-email" name="email" class="input-field" placeholder="Digite seu email" required autocomplete="email">
                    </div>

                    <div class="remember-row">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="terms" name="terms" required>
                            <span class="checkmark"></span>
                            <span class="label-text">Eu li e aceito os termos de privacidade</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-primary">
                        <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
                        </svg>
                        <span class="text">Cadastrar-se</span>
                        <span class="circle"></span>
                        <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
                        </svg>
                    </button>

                    <hr class="divider" style="margin-top: 18px;">

                    <p class="register-text">
                        Já possui uma conta? <a href="javascript:void(0)" id="to-login-btn" class="link-register">Clique aqui</a>
                    </p>
                </form>
            </div>

        </section>
    </main>

    <!-- SCRIPT DE TRANSIÇÃO -->
    <script src="script.js"></script>
</body>

</html>
