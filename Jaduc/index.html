<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | JADUC</title>
    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="styleguide.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="login">
        <div class="rectangle" aria-hidden="true"></div>
        <section class="div" aria-labelledby="welcome-title">
            <h1 class="text-wrapper-7" id="welcome-title">Bem Vindo!</h1>
            <p class="text-wrapper-8">Ao Site</p>
            <p class="text-wrapper-9">JADUC</p>
            <div class="group" aria-hidden="true">
                <div class="rectangle-2"></div>
                <div class="rectangle-3"></div>
            </div>
            <div class="group-2" aria-hidden="true">
                <div class="rectangle-4"></div>
                <div class="rectangle-5"></div>
                <div class="rectangle-6"></div>
                <div class="rectangle-7"></div>
                <div class="rectangle-8"></div>
                <div class="rectangle-9"></div>
            </div>
        </section>
        <section aria-labelledby="login-title">
            <h2 class="p" id="login-title">Faça login com sua conta</h2>
            <form>
                <label class="text-wrapper" for="email">Email</label>
                <input class="rectangle-10" id="email" name="email" type="email" placeholder="Digite seu email"
                    autocomplete="email" inputmode="email" required>
                <label class="text-wrapper-2" for="password">Senha</label>
                <input class="rectangle-11" id="password" name="password" type="password" placeholder="Digite sua senha"
                    autocomplete="current-password" required>
                <input class="rectangle-13" id="remember-me" name="remember-me" type="checkbox">
                <label class="text-wrapper-5" for="remember-me">Lembre de mim</label>
                <button class="rectangle-12" type="submit">Entrar na comunidade</button>
                <a class="text-wrapper-4" href="#recuperar-senha">Esqueceu sua senha?</a>
                <p class="text-wrapper-3">Ou faça login com</p>
                <button class="image-wrapper" type="button" aria-label="Entrar com Microsoft">
                    <img class="image" src="img/microsoft_icon.svg" alt="Microsoft">
                </button>
                <button class="group-wrapper" type="button" aria-label="Entrar com Google">
                    <span class="group-3">
                        <img class="image-2" src="img/google_icon.svg" alt="Google">
                    </span>
                </button>
                <hr class="line">
                <p class="n-o-est-castrado">
                    <span class="span">Não está cadastrado?</span>
                    <a class="text-wrapper-6" href="#cadastro">Clique aqui</a>
                </p>
            </form>
        </section>
    </main>
</body>

</html>
